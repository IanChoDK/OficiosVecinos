<!DOCTYPE html>

<html class="h-full bg-[#f4f3f4]" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Editar Datos - Prestador | Oficios Vecinos</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#1764AE',
              dark: '#00112B',
              surface: '#D6D8DC',
              card: '#D9D9D9',
              darkbtn: '#1E232A'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="h-full flex flex-col justify-start items-center text-[#00112B] bg-[#ececec] antialiased select-none">
<!-- BEGIN: MobileDeviceFrame -->
<div class="w-full max-w-[430px] min-h-screen bg-[#F5F6F8] flex flex-col shadow-2xl relative">
<!-- BEGIN: TopBar -->
<header class="w-full bg-[#D7D9DC] border-b border-[#C3C6CC] px-4 pt-3 pb-2.5 flex items-center justify-between gap-2 z-20" data-purpose="app-header">
<!-- Logo / Brand Title -->
<a class="flex flex-col leading-tight select-none" href="#">
<span class="text-sm font-bold text-[#00112B] tracking-tight">Oficios</span>
<span class="text-sm font-bold text-[#00112B] tracking-tight -mt-1">Vecinos</span>
</a>
<!-- Search Input -->
<div class="relative flex-1 max-w-[170px]" data-purpose="search-box">
<input class="w-full h-8 pl-3.5 pr-7 text-xs bg-white text-[#00112B] placeholder-gray-400 rounded-full border-none shadow-inner focus:outline-none focus:ring-1 focus:ring-[#1764AE]" placeholder="Buscar" type="text"/>
<button aria-label="Buscar" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700" type="button">
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Action Icons: Chat & Profile Avatar -->
<div class="flex items-center space-x-2.5">
<!-- Messages Link -->
<a aria-label="Mensajes" class="relative p-1 text-[#00112B] hover:text-[#1764AE] transition-colors" href="#">
<svg class="w-5 h-5 fill-none stroke-current" stroke-width="2" viewbox="0 0 24 24">
<path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</a>
<!-- User Avatar Thumbnail -->
<a aria-label="Perfil" class="block w-8 h-8 rounded-full bg-[#1E232A] border-2 border-white overflow-hidden shadow-sm flex-shrink-0" href="#">
<div class="w-full h-full flex items-center justify-center text-white text-xs font-semibold">R</div>
</a>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: BackNavigation -->
<nav class="w-full bg-[#B8BCC2] px-4 py-1.5 flex items-center shadow-inner" data-purpose="sub-nav">
<button aria-label="Volver" class="w-7 h-7 rounded-full flex items-center justify-center text-white hover:bg-black/10 active:scale-95 transition-transform" onclick="window.history.back()" type="button">
<svg class="w-5 h-5 stroke-current" fill="none" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<span class="text-xs font-semibold text-[#00112B] ml-2 tracking-wide uppercase">Editar Datos</span>
</nav>
<!-- END: BackNavigation -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-4 py-5 flex flex-col justify-start items-center w-full" data-purpose="edit-profile-container">
<!-- Main Profile Card -->
<section class="w-full max-w-sm bg-[#D5D7DC] rounded-3xl p-6 shadow-sm border border-[#C6C9D0] flex flex-col items-center" data-purpose="edit-profile-card">
<!-- BEGIN: AvatarSection -->
<div class="relative mb-6" data-purpose="avatar-upload">
<!-- Circular Avatar with Camera Icon -->
<div class="w-28 h-28 rounded-full bg-[#1E232A] flex items-center justify-center shadow-md relative group cursor-pointer">
<svg class="w-10 h-10 text-white stroke-current fill-none" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0zM18.75 10.5h.008v.008h-.008V10.5z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<!-- Badge Plus overlay -->
<div class="absolute bottom-1 right-1 w-6 h-6 rounded-full bg-[#1764AE] text-white flex items-center justify-center border-2 border-white shadow">
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-width="3" viewbox="0 0 24 24">
<path d="M12 4.5v15m7.5-7.5h-15" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Hidden file input for interactivity -->
<input accept="image/*" class="hidden" id="avatar-input" type="file"/>
</div>
<label class="block text-center text-[11px] font-semibold text-[#1764AE] mt-2 cursor-pointer hover:underline" for="avatar-input">
            Cambiar foto
          </label>
</div>
<!-- END: AvatarSection -->
<!-- BEGIN: EditForm -->
<form class="w-full flex flex-col space-y-4" data-purpose="provider-edit-form" onsubmit="event.preventDefault(); alert('Cambios guardados con éxito!');">
<!-- Field: Nombre -->
<div class="flex flex-col space-y-1">
<label class="text-xs font-semibold text-[#00112B] pl-1" for="nombre-input">
              Nombre:
            </label>
<input class="w-full bg-white text-sm text-[#00112B] font-medium px-4 py-2.5 rounded-full border border-gray-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#1764AE] focus:border-transparent transition-all" id="nombre-input" name="nombre" placeholder="Roberto (Editar nombre)" required="" type="text" value="Roberto"/>
</div>
<!-- Field: Mail -->
<div class="flex flex-col space-y-1">
<label class="text-xs font-semibold text-[#00112B] pl-1" for="mail-input">
              Mail:
            </label>
<input class="w-full bg-white text-sm text-[#00112B] font-medium px-4 py-2.5 rounded-full border border-gray-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#1764AE] focus:border-transparent transition-all" id="mail-input" name="mail" placeholder="Roberto@email.com" required="" type="email" value="Roberto@email.com"/>
</div>
<!-- Field: Teléfono / WhatsApp (Opcional/Complementario) -->
<div class="flex flex-col space-y-1">
<label class="text-xs font-semibold text-[#00112B] pl-1" for="phone-input">
              Teléfono:
            </label>
<input class="w-full bg-white text-sm text-[#00112B] font-medium px-4 py-2.5 rounded-full border border-gray-200 shadow-sm focus:outline-none focus:ring-2 focus:ring-[#1764AE] focus:border-transparent transition-all" id="phone-input" name="phone" placeholder="+54 9 11 xxxx-xxxx" type="tel" value="+54 9 11 4521-8890"/>
</div>
<!-- Spacer for layout balance -->
<div class="pt-4"></div>
<!-- Submit Button: Guardar Cambios -->
<button class="w-full py-3 px-6 bg-[#1E232A] hover:bg-[#00112B] text-white font-medium text-sm rounded-full shadow-md active:scale-95 transition duration-150 flex items-center justify-center tracking-wide" type="submit">
            Guardar cambios
          </button>
</form>
<!-- END: EditForm -->
</section>
<!-- END: Main Profile Card -->
</main>
<!-- END: MainContent -->
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
