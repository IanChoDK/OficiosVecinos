<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Oficios Vecinos - Olvidé mi contraseña</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Inter -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#1764AE',
              hover: '#135494',
              light: '#EAF2F9',
              dark: '#0F4475',
            }
          },
          boxShadow: {
            'ios-card': '0 8px 30px rgba(0, 0, 0, 0.06)',
            'ios-button': '0 4px 14px rgba(23, 100, 174, 0.25)',
          }
        }
      }
    }
  </script>
<style data-purpose="base-setup">
    /* iOS friendly bounce & touch styling */
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: 'Inter', sans-serif;
    }
    input:focus {
      outline: none;
    }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen flex flex-col justify-between antialiased selection:bg-blue-100 selection:text-brand">
<!-- BEGIN: MainHeader -->
<header class="w-full bg-white border-b border-slate-200/80 sticky top-0 z-50 backdrop-blur-md bg-white/95">
<div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between gap-2">
<!-- Logo Branding -->
<a class="flex flex-col leading-tight shrink-0 focus:outline-none" href="#">
<span class="text-[17px] font-bold tracking-tight text-slate-900 leading-none">Oficios</span>
<span class="text-[17px] font-bold tracking-tight text-brand leading-none">Vecinos</span>
</a>
<!-- Quick Search Bar -->
<div class="relative flex-1 max-w-[170px] xs:max-w-[200px]">
<input class="w-full h-8 pl-3 pr-7 text-xs bg-slate-100 border border-slate-200 rounded-full text-slate-700 placeholder-slate-400 focus:bg-white focus:border-brand focus:ring-1 focus:ring-brand transition-all" placeholder="Buscar..." type="text"/>
<div class="absolute inset-y-0 right-2.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Action Button / Header Iniciar Sesión -->
<a class="shrink-0 text-xs font-semibold px-3 py-1.5 rounded-full bg-slate-100 hover:bg-slate-200 text-slate-700 active:scale-95 transition-transform" href="#">
        Iniciar sesión
      </a>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex flex-col items-center justify-center px-4 py-8 w-full max-w-md mx-auto">
<!-- BEGIN: RecoveryCard -->
<section class="w-full bg-white rounded-2xl shadow-ios-card border border-slate-100 p-6 sm:p-8 flex flex-col items-center text-center" data-purpose="password-recovery-card">
<!-- Sub-icon badge container -->
<div class="w-14 h-14 rounded-2xl bg-blue-50 border border-blue-100/80 flex items-center justify-center text-brand mb-5 shadow-sm">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Title & Support Description -->
<h1 class="text-xl sm:text-2xl font-bold text-slate-900 tracking-tight mb-2">
        Olvidé mi contraseña
      </h1>
<p class="text-xs sm:text-sm text-slate-500 max-w-[270px] leading-relaxed mb-6">
        Ingresá el correo asociado a tu cuenta para restablecer tu contraseña.
      </p>
<!-- Form Component -->
<form class="w-full space-y-4" onsubmit="event.preventDefault();">
<div class="text-left">
<label class="block text-xs font-semibold text-slate-700 mb-1.5 pl-0.5" for="recovery-email">
            Ingresar mail:
          </label>
<!-- Email Input Field with Icon -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full h-11 pl-10 pr-4 text-sm bg-slate-50/70 border border-slate-200 rounded-xl text-slate-900 placeholder:text-slate-400 focus:bg-white focus:border-brand focus:ring-2 focus:ring-brand/20 transition-all duration-150" id="recovery-email" name="email" placeholder="ejemplo@correo.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-11 bg-brand hover:bg-brand-hover text-white text-sm font-semibold rounded-xl shadow-ios-button active:scale-[0.98] transition-all duration-150 flex items-center justify-center gap-2 mt-2" type="submit">
<span>Enviar correo de recuperación</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</form>
<!-- Security / Help helper footnote -->
<div class="mt-6 pt-4 border-t border-slate-100 w-full flex items-center justify-center gap-1.5 text-[11px] text-slate-400">
<svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Proceso 100% seguro y confidencial</span>
</div>
</section>
<!-- END: RecoveryCard -->
<!-- BEGIN: BackNavigation -->
<!-- Lower link to return to Login -->
<div class="mt-6 flex items-center justify-center">
<a class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-medium text-slate-600 hover:text-brand active:opacity-70 transition-colors py-1.5 px-3 rounded-lg hover:bg-slate-100/70" href="#">
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Volver a iniciar sesión</span>
</a>
</div>
<!-- END: BackNavigation -->
</main>
<!-- END: MainContent -->
<!-- BEGIN: MinimalFooter -->
<footer class="w-full py-4 text-center text-xs text-slate-400 border-t border-slate-100 bg-white/50">
<p>© 2024 Oficios Vecinos. Todos los derechos reservados.</p>
</footer>
<!-- END: MinimalFooter -->
</body></html>
