<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Prestador - Gestión y Menú de Perfil</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN with forms and container-queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              blue: '#1764ae',
              dark: '#00112b',
              surface: '#f4f3f4',
              card: '#d9d9de',
              action: '#565c65',
              actionHover: '#424750'
            }
          }
        }
      }
    }
  </script>
<!-- Custom styles for layout and iOS-friendly touches -->
<style data-purpose="base-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #e5e5eb;
    }
    /* Safe-area insets handling for iOS devices */
    .ios-safe-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .ios-safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-brand-dark">
<!-- BEGIN: MobileContainer -->
<!-- Main iOS mobile screen wrapper -->
<main class="w-full max-w-[420px] min-h-[100dvh] sm:min-h-[850px] sm:h-[870px] bg-[#f8f8fa] flex flex-col justify-between shadow-2xl sm:rounded-[40px] overflow-hidden relative border-0 sm:border border-slate-200">
<!-- Top Section Container (Status Bar + Navbar + Main Content) -->
<div class="flex-1 flex flex-col">
<!-- BEGIN: StatusBar -->
<!-- Emulated iOS Status Bar -->
<div class="w-full pt-3 px-7 flex justify-between items-center text-xs font-semibold text-brand-dark z-20 select-none">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular signal -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.37 19.58 10.63 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9z" opacity="0.3"></path><path d="M2 22h20L12 2z"></path></svg>
<!-- Wifi -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24"><path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.78 0 7.21 1.5 9.71 3.93L12 19.34 2.29 11.43C4.79 8.99 8.22 7.5 12 7.5z"></path></svg>
<!-- Battery -->
<div class="w-5 h-2.5 border border-current rounded-sm p-0.5 flex items-center">
<div class="bg-current h-full w-full rounded-xs"></div>
</div>
</div>
</div>
<!-- END: StatusBar -->
<!-- BEGIN: Navbar -->
<!-- Navbar superior exclusiva según wireframe: Logo, Buscador, Chat y Avatar -->
<header class="w-full bg-[#f8f8fa] px-4 pt-3 pb-3 border-b border-gray-200/80 flex items-center justify-between gap-2.5">
<!-- Logo Text -->
<a aria-label="Ir a inicio" class="flex flex-col leading-none shrink-0 group focus:outline-none" href="#">
<span class="text-[15px] font-extrabold tracking-tight text-brand-dark group-hover:text-brand-blue transition-colors">Oficios</span>
<span class="text-[13px] font-bold text-brand-blue tracking-tight">Vecinos</span>
</a>
<!-- Search Input Bar -->
<div class="flex-1 max-w-[170px] relative">
<label class="sr-only" for="search-input">Buscar</label>
<input class="w-full h-8 pl-3 pr-8 text-xs bg-white text-gray-700 placeholder-gray-400 rounded-full border border-gray-300 shadow-sm focus:border-brand-blue focus:ring-1 focus:ring-brand-blue outline-none transition-all" id="search-input" placeholder="Buscar" type="search"/>
<button aria-label="Ejecutar búsqueda" class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-brand-blue" type="button">
<svg class="w-3.5 h-3.5 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<circle cx="11" cy="11" r="8"></circle>
<line x1="21" x2="16.65" y1="21" y2="16.65"></line>
</svg>
</button>
</div>
<!-- Right Action Icons: Messages & User Avatar -->
<div class="flex items-center space-x-2 shrink-0">
<!-- Chat Button with Notification Indicator -->
<button aria-label="Mensajes y notificaciones" class="relative p-1 text-gray-700 hover:text-brand-blue transition-colors" type="button">
<svg class="w-6 h-6 stroke-current fill-transparent" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
</svg>
<span class="absolute top-1 right-0.5 w-2 h-2 bg-brand-blue rounded-full ring-2 ring-[#f8f8fa]"></span>
</button>
<!-- Circular User Avatar -->
<a aria-label="Perfil del prestador" class="w-8 h-8 rounded-full bg-brand-dark flex items-center justify-center text-white ring-2 ring-gray-200 hover:ring-brand-blue transition-all overflow-hidden focus:outline-none focus:ring-2 focus:ring-brand-blue" href="#">
<svg class="w-5 h-5 fill-current text-white/90 translate-y-0.5" viewbox="0 0 24 24">
<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
</svg>
</a>
</div>
</header>
<!-- END: Navbar -->
<!-- BEGIN: ManagementCardSection -->
<!-- Contenedor central con tarjeta de 'Gestion' según Pantalla 1 del wireframe -->
<section aria-labelledby="gestion-title" class="px-5 pt-7 pb-4 w-full flex-1 flex flex-col items-center">
<div class="w-full bg-[#d6d6dc] rounded-2xl p-6 shadow-sm border border-gray-300/60 flex flex-col items-center">
<!-- Section Heading -->
<h2 class="text-xl font-semibold text-gray-800 mb-6 tracking-tight" id="gestion-title">
            Gestion
          </h2>
<!-- Action Buttons Stack inside Card -->
<div class="w-full flex flex-col gap-5">
<!-- Botón Principal: Ofrecer un nuevo servicio -->
<button class="w-full h-24 bg-[#565c65] hover:bg-[#434850] active:scale-[0.98] text-white font-medium text-base rounded-2xl shadow-md transition-all duration-150 flex items-center justify-center text-center px-4 leading-tight focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue" type="button">
<span>Ofrecer un nuevo servicio</span>
</button>
<!-- Botón Secundario: Mis servicios -->
<button class="w-full h-24 bg-[#565c65] hover:bg-[#434850] active:scale-[0.98] text-white font-medium text-base rounded-2xl shadow-md transition-all duration-150 flex items-center justify-center text-center px-4 leading-tight focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue" type="button">
<span>Mis servicios</span>
</button>
</div>
</div>
</section>
<!-- END: ManagementCardSection -->
</div>
<!-- End Top Section -->
<!-- BEGIN: BottomNavigationLinks -->
<!-- Botones de pie de página: 'Ir al Perfil' y 'Mensajes' (Sin Bottom Tab Bar convencional) -->
<footer class="w-full px-8 pb-8 pt-2 ios-safe-bottom flex flex-col gap-3.5 items-center">
<!-- Botón Redondeado Pill: Ir al Perfil -->
<button class="w-full max-w-[280px] h-12 bg-[#d6d6dc] hover:bg-[#c9c9d0] active:scale-[0.98] text-gray-800 font-medium text-[15px] rounded-full shadow-sm transition-all duration-150 flex items-center justify-center text-center border border-gray-300/80 focus:outline-none focus:ring-2 focus:ring-brand-blue" type="button">
        Ir al Perfil
      </button>
<!-- Botón Redondeado Pill: Mensajes -->
<button class="w-full max-w-[280px] h-12 bg-[#d6d6dc] hover:bg-[#c9c9d0] active:scale-[0.98] text-gray-800 font-medium text-[15px] rounded-full shadow-sm transition-all duration-150 flex items-center justify-center text-center border border-gray-300/80 focus:outline-none focus:ring-2 focus:ring-brand-blue" type="button">
        Mensajes
      </button>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-gray-400/40 rounded-full mt-3"></div>
</footer>
<!-- END: BottomNavigationLinks -->
</main>
<!-- END: MobileContainer -->
</body></html>
