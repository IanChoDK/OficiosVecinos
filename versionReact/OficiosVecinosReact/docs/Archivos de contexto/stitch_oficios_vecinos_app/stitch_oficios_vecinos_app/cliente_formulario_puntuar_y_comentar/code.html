<script data-purpose="interactive-ratings">
    // Textarea live character counter
    const commentInput = document.getElementById('comment');
    const charCounter = document.getElementById('char-counter');

    if (commentInput && charCounter) {
      commentInput.addEventListener('input', (e) => {
        const count = e.target.value.length;
        charCounter.textContent = `${count} / 300`;
      });
    }

    // Star rating selector
    const starButtons = document.querySelectorAll('.star-btn');
    const ratingText = document.getElementById('rating-text');
    const labels = {
      1: 'Malo (1 de 5)',
      2: 'Regular (2 de 5)',
      3: 'Bueno (3 de 5)',
      4: 'Muy Bueno (4 de 5)',
      5: 'Excelente (5 de 5)'
    };

    starButtons.forEach(button => {
      button.addEventListener('click', () => {
        const selectedValue = parseInt(button.getAttribute('data-star'), 10);
        
        starButtons.forEach(btn => {
          const val = parseInt(btn.getAttribute('data-star'), 10);
          if (val <= selectedValue) {
            btn.classList.remove('text-slate-300');
            btn.classList.add('text-amber-400');
          } else {
            btn.classList.remove('text-amber-400');
            btn.classList.add('text-slate-300');
          }
        });

        if (ratingText && labels[selectedValue]) {
          ratingText.textContent = labels[selectedValue];
        }
      });
    });
  </script>
