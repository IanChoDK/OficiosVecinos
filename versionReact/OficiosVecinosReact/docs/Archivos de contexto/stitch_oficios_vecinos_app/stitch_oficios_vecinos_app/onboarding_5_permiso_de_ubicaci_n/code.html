<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Oficios Vecinos - Dónde necesitas ayuda</title>
<!-- Tailwind CSS CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration for exact design tokens -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#1764ae',
              primaryHover: '#13528f',
              dark: '#00112b',
              surface: '#f4f3f4',
              surfaceAlt: '#e8edf3',
              muted: '#627282',
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'SF Pro Display', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          boxShadow: {
            'radar': '0 20px 40px -15px rgba(23, 100, 174, 0.18)',
            'pill': '0 4px 12px rgba(0, 17, 43, 0.08)',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-animations">
    /* Subtle pulse animation for center location ping */
    @keyframes radar-pulse {
      0% {
        transform: scale(0.95);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.02);
        opacity: 1;
      }
      100% {
        transform: scale(0.95);
        opacity: 0.85;
      }
    }
    .radar-animated {
      animation: radar-pulse 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-0 sm:p-4 text-brand-dark antialiased selection:bg-brand-primary selection:text-white">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Container simulating an iOS viewport -->
<main class="w-full max-w-[412px] h-[100dvh] sm:h-[844px] bg-[#f4f3f4] sm:rounded-[44px] shadow-2xl overflow-hidden flex flex-col justify-between relative border border-black/5" data-purpose="onboarding-screen">
<!-- BEGIN: TopBar -->
<!-- Top app header with App Name and Skip button -->
<header class="pt-12 pb-3 px-6 flex items-center justify-between z-10" data-purpose="header-navigation">
<div class="flex flex-col">
<span class="text-[17px] font-bold tracking-tight text-brand-dark leading-tight">Oficios</span>
<span class="text-[17px] font-bold tracking-tight text-brand-primary leading-tight">Vecinos</span>
</div>
<!-- Omitir / Skip action -->
<button class="text-xs font-semibold px-3.5 py-1.5 rounded-full bg-white/80 hover:bg-white text-brand-dark/70 hover:text-brand-dark border border-black/5 shadow-sm transition active:scale-95 backdrop-blur-sm" data-purpose="skip-button" type="button">
        Omitir
      </button>
</header>
<!-- END: TopBar -->
<!-- BEGIN: ContentArea -->
<!-- Central graphic + informative copy -->
<div class="flex-1 flex flex-col items-center justify-center px-6 min-h-0" data-purpose="main-content">
<!-- Visual radar representation replicating the wireframe wire element -->
<section class="w-full max-w-[320px] aspect-square rounded-3xl bg-white border border-slate-200/80 shadow-radar p-5 flex flex-col items-center justify-between relative overflow-hidden" data-purpose="radar-graphic-area">
<!-- Subtle map grid background accents -->
<div class="absolute inset-0 opacity-[0.035] bg-[radial-gradient(#00112b_1px,transparent_1px)] [background-size:16px_16px] pointer-events-none"></div>
<!-- Radar Rings Graphic -->
<div aria-label="Mapa de radio de ubicación" class="relative w-full flex-1 flex items-center justify-center">
<!-- Outer circular boundary -->
<div class="w-52 h-52 rounded-full border-2 border-brand-primary/20 bg-brand-primary/[0.03] flex items-center justify-center relative radar-animated">
<!-- Middle ring -->
<div class="w-36 h-36 rounded-full border border-dashed border-brand-primary/35 flex items-center justify-center">
<!-- Inner active zone -->
<div class="w-20 h-20 rounded-full bg-brand-primary/10 border border-brand-primary/40 flex items-center justify-center">
<!-- User center pin dot with ripple -->
<div class="relative flex items-center justify-center">
<span class="absolute inline-flex h-6 w-6 rounded-full bg-brand-primary opacity-30 animate-ping"></span>
<div class="w-3.5 h-3.5 rounded-full bg-brand-primary ring-4 ring-white shadow-md"></div>
</div>
</div>
</div>
<!-- Neighbor placeholder indicators inside radius -->
<div class="absolute top-6 right-10 w-2 h-2 rounded-full bg-slate-400"></div>
<div class="absolute bottom-9 left-9 w-2 h-2 rounded-full bg-slate-400"></div>
<div class="absolute bottom-8 right-12 w-2 h-2 rounded-full bg-slate-400"></div>
</div>
</div>
<!-- Metric chip pill: 'Distancia en Km: 3' -->
<div class="z-10 mt-1 self-start inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-[#f4f3f4] border border-slate-200/90 shadow-pill" data-purpose="distance-indicator">
<svg class="w-3.5 h-3.5 text-brand-primary" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
<span class="text-[13px] font-semibold text-brand-dark">Distancia en Km: 3</span>
</div>
</section>
<!-- Text Headings -->
<section class="mt-7 text-center max-w-[325px]" data-purpose="copy-section">
<h1 class="text-2xl font-bold tracking-tight text-brand-dark leading-snug">
          Donde necesitas ayuda?
        </h1>
<p class="mt-2.5 text-[14px] leading-relaxed text-brand-muted font-normal">
          Usamos tu ubicacion solo para mostrarte vecinos que ofrecen servicios cerca. Podes cambiarla cuando quieras
        </p>
</section>
</div>
<!-- END: ContentArea -->
<!-- BEGIN: BottomControls -->
<!-- Pagination dots and primary / secondary actions -->
<footer class="px-6 pb-9 pt-2 flex flex-col items-center gap-5" data-purpose="actions-container">
<!-- 5-dots Step Indicator (Screen 4 of 5 active, matching column 4 in zero-indexed list or dot 4 in 5-step wireframe flow) -->
<nav aria-label="Progreso del onboarding" class="flex items-center justify-center gap-2" data-purpose="pagination-dots">
<span class="w-2 h-2 rounded-full bg-slate-300"></span>
<span class="w-2 h-2 rounded-full bg-slate-300"></span>
<span class="w-2 h-2 rounded-full bg-slate-300"></span>
<!-- Active Dot for Screen 4/5 -->
<span aria-current="step" class="w-5 h-2 rounded-full bg-brand-primary"></span>
<span class="w-2 h-2 rounded-full bg-slate-300"></span>
</nav>
<!-- Action Buttons -->
<div class="w-full flex flex-col gap-2.5 max-w-[340px]">
<!-- Primary Button -->
<button class="w-full py-3.5 px-6 rounded-2xl bg-brand-primary hover:bg-brand-primaryHover text-white text-[15px] font-semibold shadow-md active:scale-[0.98] transition flex items-center justify-center text-center" data-purpose="primary-action" type="button">
          Permitir ubicacion
        </button>
<!-- Secondary Button -->
<button class="w-full py-3.5 px-6 rounded-2xl bg-white hover:bg-white/80 text-brand-dark text-[15px] font-semibold border border-slate-300 active:scale-[0.98] transition flex items-center justify-center text-center shadow-sm" data-purpose="secondary-action" type="button">
          Quizas mas tarde
        </button>
</div>
</footer>
<!-- END: BottomControls -->
</main>
<!-- END: MobileDeviceContainer -->
</body></html>
