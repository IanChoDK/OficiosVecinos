<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Error al Editar Servicio - Oficios Vecinos</title>
<!-- Google Font: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#1764AE',
              dark: '#00112B',
              surface: '#E2E2E3',
              card: '#D9D9DA',
              btnDark: '#555555',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          boxShadow: {
            'ios-sheet': '0 8px 30px rgba(0, 17, 43, 0.08)',
          }
        }
      }
    }
  </script>
<!-- Global Base Styles -->
<style data-purpose="base-styling">
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #0b0f17;
    }
    /* iOS safe areas support */
    .pt-safe {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
  </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 select-none">
<!-- BEGIN: MobileDeviceFrame -->
<div class="relative w-full max-w-[412px] h-[100dvh] max-h-[892px] bg-white flex flex-col justify-between overflow-hidden sm:rounded-[44px] shadow-2xl" data-purpose="mobile-viewport">
<!-- Top Safe Area Spacer for iOS Status Bar -->
<div class="pt-safe w-full bg-[#E2E2E3]"></div>
<!-- BEGIN: TopHeader -->
<!-- Barra superior idéntica a la vista original de Oficios Vecinos -->
<header class="w-full bg-[#E2E2E3] px-3.5 py-2.5 flex items-center justify-between border-b border-black/5" data-purpose="app-header">
<!-- Logo / Identificador de la app -->
<div class="flex flex-col leading-none pr-1">
<span class="text-brand-dark font-extrabold text-[13px] tracking-tight">Oficios</span>
<span class="text-brand-dark font-bold text-[13px] tracking-tight">Vecinos</span>
</div>
<!-- Barra de Búsqueda Compacta -->
<div class="flex-1 mx-2 max-w-[175px]">
<div class="relative flex items-center">
<input class="w-full h-[28px] pl-3 pr-7 bg-white text-xs text-brand-dark rounded-full border-0 focus:ring-1 focus:ring-brand-primary placeholder:text-gray-400 cursor-pointer shadow-sm" placeholder="Buscar" readonly="" type="text"/>
<svg class="w-3.5 h-3.5 text-gray-500 absolute right-2 pointer-events-none" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
</div>
<!-- Iconos de Acción: Mensajes y Perfil -->
<div class="flex items-center space-x-2 shrink-0">
<!-- Icono Chat / Mensajes -->
<button aria-label="Mensajes" class="text-brand-dark hover:opacity-75 transition-opacity p-0.5" type="button">
<svg class="w-6 h-6 stroke-[1.75]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Avatar de Perfil -->
<div class="w-7 h-7 rounded-full bg-brand-dark flex items-center justify-center cursor-pointer shadow-inner">
<svg class="w-4 h-4 text-white" fill="currentColor" viewbox="0 0 24 24">
<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
</svg>
</div>
</div>
</header>
<!-- END: TopHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex flex-col px-4 pt-4 pb-2 overflow-hidden justify-between" data-purpose="error-view-content">
<!-- Tarjeta Contenedora Principal con aspecto gris sutil fiel al diseño -->
<section class="w-full flex-1 bg-brand-surface rounded-[24px] flex flex-col items-center justify-center px-6 text-center border border-black/5 shadow-ios-sheet transition-all" data-purpose="error-card">
<!-- Mensaje Principal de Error -->
<h1 class="text-brand-dark text-[22px] sm:text-[23px] font-bold tracking-tight leading-snug max-w-[240px] mb-8">
          Ups, algo falló reintentalo
        </h1>
<!-- Gran Círculo con Icono de Cruz '✕' -->
<div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-brand-dark flex items-center justify-center shadow-lg ring-4 ring-black/5 transition-transform hover:scale-105 active:scale-95 duration-200" data-purpose="error-indicator">
<svg class="w-12 h-12 text-white stroke-[3.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Mensaje descriptivo de soporte/error -->
<p class="mt-8 text-gray-600 text-xs sm:text-sm leading-relaxed max-w-[270px]">
          No se pudieron guardar las modificaciones en tu servicio. Por favor revisa tu conexión e inténtalo de nuevo.
        </p>
</section>
<!-- BEGIN: ActionControls -->
<!-- Botón de acción principal al pie: Volver a editar -->
<div class="w-full pt-4 pb-3 flex flex-col items-center" data-purpose="action-footer">
<button class="w-full py-4 px-6 bg-[#4A4B4D] hover:bg-[#3D3E40] active:scale-[0.985] text-white text-base font-semibold rounded-2xl shadow-md transition-all flex items-center justify-center" onclick="window.history.back()" type="button">
          Volver a editar
        </button>
</div>
<!-- END: ActionControls -->
</main>
<!-- END: MainContent -->
<!-- iOS Home Indicator bar -->
<div class="w-full flex justify-center pb-2.5 pt-0.5">
<div class="w-32 h-1 bg-gray-300 rounded-full"></div>
</div>
</div>
<!-- END: MobileDeviceFrame -->
</body></html>
