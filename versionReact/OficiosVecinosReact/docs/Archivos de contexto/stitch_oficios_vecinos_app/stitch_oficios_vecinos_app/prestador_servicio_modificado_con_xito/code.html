<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Confirmación de Edición - Oficios Vecinos</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#1764AE',
              dark: '#00112B',
              surface: '#E2E2E3',
              cardBg: '#D9D9D9',
              success: '#10B981',
              charcoal: '#4E5356'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          boxShadow: {
            card: '0 8px 30px rgba(0, 17, 43, 0.06)',
            button: '0 4px 14px rgba(23, 100, 174, 0.28)'
          }
        }
      }
    }
  </script>
<!-- Custom Styles for iOS viewport and transitions -->
<style data-purpose="custom-layout">
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior-y: none;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 12px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-0 sm:p-4 text-brand-dark antialiased select-none">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Outer iOS Mobile Shell -->
<div class="w-full max-w-[430px] min-h-screen sm:min-h-[880px] sm:max-h-[920px] bg-[#F7F9FB] sm:rounded-[44px] shadow-2xl overflow-hidden flex flex-col justify-between border-0 sm:border-[8px] sm:border-[#1E293B] relative" data-purpose="mobile-screen-wrapper">
<!-- BEGIN: TopBar -->
<header class="w-full bg-white border-b border-gray-200/80 px-4 pt-3 pb-3 safe-top flex items-center justify-between gap-2.5 z-20" data-purpose="top-navigation-bar">
<!-- Brand Logo / Title -->
<div class="flex-shrink-0" data-purpose="brand-logo">
<a aria-label="Oficios Vecinos Inicio" class="flex flex-col leading-none group" href="#">
<span class="text-[13px] font-extrabold tracking-tight text-brand-dark leading-tight group-hover:text-brand-blue transition-colors">Oficios</span>
<span class="text-[13px] font-bold text-brand-blue tracking-tight leading-tight">Vecinos</span>
</a>
</div>
<!-- Compact Search Bar -->
<div class="flex-1 max-w-[155px] mx-1" data-purpose="header-search">
<div class="relative flex items-center">
<input aria-label="Buscar en la plataforma" class="w-full h-8 pl-3 pr-7 bg-[#EFEFF1] text-[12px] font-medium placeholder-gray-500 rounded-full border-none focus:ring-1 focus:ring-brand-blue/50 focus:bg-white transition-all cursor-pointer" placeholder="Buscar" readonly="" type="text"/>
<svg class="w-3.5 h-3.5 text-gray-500 absolute right-2.5 pointer-events-none" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 18a7.5 7.5 0 006.15-2.85z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
</div>
<!-- Action Icons: Chat & Profile -->
<div class="flex items-center space-x-2.5 flex-shrink-0" data-purpose="header-user-actions">
<!-- Chat Icon -->
<button aria-label="Mensajes" class="w-8 h-8 rounded-full flex items-center justify-center text-gray-700 hover:bg-gray-100 active:scale-95 transition-all" type="button">
<svg class="w-5 h-5 text-[#2A2F35]" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewbox="0 0 24 24">
<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
</svg>
</button>
<!-- User Avatar Circle -->
<button aria-label="Perfil del usuario" class="w-8 h-8 rounded-full bg-[#1A2530] text-white flex items-center justify-center font-bold text-xs ring-2 ring-transparent hover:ring-brand-blue/30 active:scale-95 transition-all" type="button">
<span class="sr-only">Perfil de Roberto</span>
<svg class="w-4 h-4 text-gray-200" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" fill-rule="evenodd"></path>
</svg>
</button>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex flex-col px-5 py-4 w-full justify-between overflow-y-auto" data-purpose="content-container">
<!-- Central Confirmation Card (Screen 4 Layout) -->
<div class="w-full flex-1 flex flex-col justify-center items-center my-auto min-h-[460px]" data-purpose="card-wrapper">
<section aria-label="Confirmación de actualización de servicio" class="w-full h-full max-h-[540px] bg-gradient-to-b from-[#DCDDE0] to-[#CFD1D6] rounded-[36px] shadow-card flex flex-col items-center justify-center px-6 py-10 text-center relative border border-white/60">
<!-- Primary Status Message -->
<div class="max-w-[260px] mb-8" data-purpose="status-header">
<h1 class="text-xl sm:text-[22px] font-bold text-brand-dark leading-snug tracking-tight">
              Se modificó el servicio correctamente
            </h1>
</div>
<!-- Success Icon Circle -->
<div class="my-3 flex items-center justify-center" data-purpose="success-badge">
<div class="w-[84px] h-[84px] rounded-full bg-brand-dark flex items-center justify-center shadow-lg transition-transform transform active:scale-95">
<!-- Crisp checkmark in official green -->
<svg class="w-11 h-11 text-brand-success" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" viewbox="0 0 24 24">
<polyline points="20 6 9 17 4 12"></polyline>
</svg>
</div>
</div>
<!-- Secondary Informative Text -->
<p class="mt-8 text-xs sm:text-[13px] font-medium text-gray-600 max-w-[240px] leading-relaxed" data-purpose="supportive-description">
            Los cambios ya están visibles para tus clientes en el vecindario.
          </p>
</section>
</div>
<!-- BEGIN: ActionButtonFooter -->
<!-- Prominent bottom primary action button -->
<footer class="w-full pt-3 pb-2 safe-bottom" data-purpose="page-footer-actions">
<a class="w-full h-[52px] bg-brand-blue hover:bg-[#135391] active:bg-[#0f4477] text-white font-bold text-[16px] tracking-wide rounded-2xl flex items-center justify-center shadow-button active:scale-[0.99] transition-all duration-150 select-none text-center" data-purpose="return-to-services-button" href="#" role="button">
          Ir a Mis Servicios
        </a>
</footer>
<!-- END: ActionButtonFooter -->
</main>
<!-- END: MainContent -->
</div>
<!-- END: MobileDeviceContainer -->
</body></html>
