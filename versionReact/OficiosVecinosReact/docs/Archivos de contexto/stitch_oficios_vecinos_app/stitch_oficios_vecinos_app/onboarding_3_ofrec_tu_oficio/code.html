<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Oficios Vecinos - Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#1764ae',
              dark: '#00112b',
              gray: '#f4f3f4',
              muted: '#64748b'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styling">
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen text-brand-dark font-sans antialiased sm:p-4">
<!-- BEGIN: MobileContainer -->
<!-- Container replicating Mobile iOS viewport specs -->
<main class="w-full max-w-[393px] h-[852px] bg-[#f4f3f4] flex flex-col justify-between relative shadow-2xl overflow-hidden sm:rounded-[48px] border-0 sm:border-[8px] sm:border-slate-800">
<!-- BEGIN: iOSStatusBar -->
<!-- Native iOS status bar indicator -->
<header class="w-full pt-3 px-8 flex justify-between items-center text-xs font-semibold text-slate-800 shrink-0 z-20" data-purpose="status-bar">
<span>9:41</span>
<div class="flex items-center space-x-2">
<!-- Cellular Signal Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23C2.89 16.48 2 14.34 2 12c0-5.52 4.48-10 10-10s10 4.48 10 10c0 2.34-.89 4.48-2.35 6.23l-.62-.62C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" opacity="0.3"></path>
<path d="M12 6a6 6 0 0 0-6 6c0 1.48.54 2.83 1.43 3.89l.71-.71A4.98 4.98 0 0 1 7 12a5 5 0 0 1 5-5 5 5 0 0 1 5 5c0 1.25-.46 2.39-1.22 3.26l.71.71A5.96 5.96 0 0 0 18 12a6 6 0 0 0-6-6z" opacity="0.5"></path>
<circle cx="12" cy="12" r="2"></circle>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0 0 12 4z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-current rounded-sm p-[1px] flex items-center">
<div class="h-full w-full bg-current rounded-2xs"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopBar -->
<!-- Navigation header with App title and Skip button -->
<nav class="w-full px-6 pt-3 pb-2 flex justify-between items-center shrink-0" data-purpose="navigation-header">
<div class="leading-tight">
<h1 class="text-base font-bold tracking-tight text-[#00112b]">Oficios</h1>
<p class="text-base font-bold tracking-tight text-[#00112b]">Vecinos</p>
</div>
<button aria-label="Omitir onboarding" class="bg-[#00112b]/80 hover:bg-[#00112b] active:scale-95 transition-all text-white text-xs font-medium px-4 py-1.5 rounded-full shadow-sm" type="button">
        Omitir
      </button>
</nav>
<!-- END: TopBar -->
<!-- BEGIN: MainContent -->
<!-- Central illustration and promotional copy -->
<section class="flex-1 flex flex-col justify-center px-6 py-2 max-w-sm mx-auto w-full text-center">
<!-- BEGIN: IllustrationCard -->
<!-- Visual representation of provider profile card matching Wireframe Screen 3 -->
<div class="w-full aspect-[4/3] bg-white rounded-3xl p-5 shadow-sm border border-slate-200/60 flex flex-col justify-center items-center relative mb-8" data-purpose="service-provider-card">
<!-- Inner Card Mockup -->
<div class="w-full bg-[#f4f3f4] rounded-2xl p-5 border border-slate-200 flex flex-col justify-between h-48 relative overflow-hidden">
<!-- Profile header with avatar, info bars and check badge -->
<div class="flex items-center justify-between">
<div class="flex items-center space-x-3">
<!-- Avatar circle -->
<div class="w-11 h-11 rounded-full bg-[#1764ae] flex items-center justify-center text-white shadow-inner">
<svg class="w-6 h-6 fill-current" viewbox="0 0 24 24">
<path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"></path>
</svg>
</div>
<!-- Text placeholder lines -->
<div class="space-y-1.5 text-left">
<div class="w-24 h-2 bg-slate-300 rounded-full"></div>
<div class="w-16 h-1.5 bg-slate-200 rounded-full"></div>
</div>
</div>
<!-- Verification Badge -->
<div class="w-6 h-6 rounded-full border-2 border-[#1764ae] flex items-center justify-center text-[#1764ae] bg-white">
<svg class="w-3.5 h-3.5 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Divider line representation -->
<div class="w-full h-1 bg-slate-200 rounded-full my-1"></div>
<!-- Bottom Action Element / Service Pill -->
<div class="w-36 h-9 mx-auto bg-[#1764ae] rounded-xl flex items-center justify-center shadow-sm">
<div class="w-16 h-1.5 bg-white/70 rounded-full"></div>
</div>
</div>
</div>
<!-- END: IllustrationCard -->
<!-- BEGIN: ContentText -->
<!-- Screen 3 Titles and descriptions verbatim from wireframe -->
<div class="space-y-3 px-2" data-purpose="screen-copy">
<h2 class="text-xl font-bold text-[#00112b] leading-tight">
          Ofrece tu oficio y encontra clientes cercanos en tu zona
        </h2>
<p class="text-xs text-slate-600 font-normal leading-relaxed px-1">
          Publica tu/s servicio/s con precio y horario. Vos elegis que pedidos aceptar
        </p>
</div>
<!-- END: ContentText -->
</section>
<!-- END: MainContent -->
<!-- BEGIN: BottomControls -->
<!-- Carousel Dots indicator and Next action button -->
<footer class="w-full px-6 pb-9 pt-2 flex flex-col items-center gap-6 shrink-0" data-purpose="footer-controls">
<!-- Dots Indicator (Page 3 of 5 active) -->
<div aria-label="Indicador de página" class="flex items-center justify-center space-x-1.5" role="tablist">
<!-- Dot 1 -->
<div aria-selected="false" class="w-2 h-2 rounded-full bg-slate-300" role="tab"></div>
<!-- Dot 2 -->
<div aria-selected="false" class="w-2 h-2 rounded-full bg-slate-300" role="tab"></div>
<!-- Dot 3 (Active) -->
<div aria-selected="true" class="w-4 h-2 rounded-full bg-[#1764ae]" role="tab"></div>
<!-- Dot 4 -->
<div aria-selected="false" class="w-2 h-2 rounded-full bg-slate-300" role="tab"></div>
<!-- Dot 5 -->
<div aria-selected="false" class="w-2 h-2 rounded-full bg-slate-300" role="tab"></div>
</div>
<!-- Action Button -->
<button class="w-full bg-[#1764ae] hover:bg-[#13508d] active:scale-[0.98] transition-all text-white font-semibold py-3.5 px-6 rounded-2xl shadow-md text-sm text-center" type="button">
        Siguiente
      </button>
<!-- iOS Home Indicator -->
<div class="w-32 h-1 bg-slate-300 rounded-full mx-auto -mb-4"></div>
</footer>
<!-- END: BottomControls -->
</main>
<!-- END: MobileContainer -->
</body></html>
