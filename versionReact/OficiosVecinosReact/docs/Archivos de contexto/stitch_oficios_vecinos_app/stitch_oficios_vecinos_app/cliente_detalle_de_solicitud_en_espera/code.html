<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Detalle de Solicitud - Oficios Vecinos</title>
<!-- Tailwind CSS v3 with Forms Plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Custom Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#1764AE',
              dark: '#00112B',
              neutral: '#E2E2E3',
              bg: '#F4F5F7',
              surface: '#FFFFFF',
              muted: '#64748B'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          },
          boxShadow: {
            card: '0 2px 10px -2px rgba(0, 17, 43, 0.06), 0 1px 4px -1px rgba(0, 17, 43, 0.04)',
            button: '0 4px 12px -2px rgba(23, 100, 174, 0.25)'
          }
        }
      }
    };
  </script>
<style data-purpose="custom-mobile-styles">
    /* iOS Safe Area paddings */
    .pt-safe {
      padding-top: env(safe-area-inset-top, 16px);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
    /* Touch optimization */
    button, a, input {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-[#F4F5F7] text-[#00112B] min-h-screen font-sans antialiased flex justify-center selection:bg-brand-primary/20">
<!-- BEGIN: MobileContainer -->
<!-- Container bounded for iOS mobile presentation -->
<div class="w-full max-w-md min-h-screen flex flex-col bg-[#F4F5F7] relative shadow-2xl">
<!-- BEGIN: TopBar -->
<!-- Top global bar: Brand title, search input, chat icon & client avatar -->
<header class="bg-white px-4 pt-safe pb-3 border-b border-[#E2E2E3] sticky top-0 z-30" data-purpose="global-header">
<div class="flex items-center justify-between gap-3 pt-2">
<!-- Logo / Brand Title -->
<div class="flex-shrink-0">
<span class="font-bold text-sm leading-tight text-[#00112B] block tracking-tight">Oficios<br/><span class="text-brand-primary">Vecinos</span></span>
</div>
<!-- Search Bar -->
<div class="flex-1 relative">
<input class="w-full h-8 pl-8 pr-3 text-xs bg-[#F4F5F7] border border-transparent rounded-full focus:bg-white focus:border-brand-primary focus:ring-1 focus:ring-brand-primary transition-all text-brand-dark placeholder-gray-400" data-purpose="quick-search-input" placeholder="Buscar..." type="text"/>
<svg class="w-3.5 h-3.5 text-gray-400 absolute left-2.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-4.35-4.35M16.65 10.65a6 6 0 11-12 0 6 6 0 0112 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
<!-- Icons: Chat & Profile Avatar -->
<div class="flex items-center space-x-2.5 flex-shrink-0">
<!-- Chat Button -->
<button aria-label="Mensajes" class="relative p-1 text-[#00112B] hover:text-brand-primary transition-colors focus:outline-none">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="absolute top-0 right-0 w-2 h-2 bg-brand-primary rounded-full ring-2 ring-white"></span>
</button>
<!-- User Avatar -->
<button aria-label="Perfil del usuario" class="w-8 h-8 rounded-full bg-[#00112B] text-white flex items-center justify-center font-medium text-xs border border-gray-200 focus:outline-none overflow-hidden">
<span class="text-[11px] font-semibold tracking-wider">RO</span>
</button>
</div>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: SubNavigation -->
<!-- Navigation action bar: Back button & Delete action -->
<nav class="px-4 py-2.5 flex items-center justify-between" data-purpose="sub-header-navigation">
<button aria-label="Volver" class="w-8 h-8 flex items-center justify-center text-[#00112B] hover:bg-gray-200/60 rounded-full transition-colors active:scale-95">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
<button aria-label="Eliminar solicitud" class="w-8 h-8 flex items-center justify-center text-red-600 hover:bg-red-50 rounded-full transition-colors active:scale-95">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</nav>
<!-- END: SubNavigation -->
<!-- BEGIN: PageHeading -->
<section class="px-4 pb-2 text-center" data-purpose="view-title">
<h1 class="text-xl font-bold text-[#00112B] tracking-tight">Detalle de solicitud</h1>
<!-- Request identification caption -->
<p class="text-xs uppercase font-semibold text-brand-muted tracking-wider mt-1">PEDIDO: Plomero - Julian</p>
</section>
<!-- END: PageHeading -->
<!-- BEGIN: MainContentArea -->
<main class="flex-1 px-4 py-3 flex flex-col gap-5 overflow-y-auto">
<!-- BEGIN: RequestDetailCard -->
<section class="bg-white rounded-2xl shadow-card border border-[#E2E2E3] p-5 space-y-5" data-purpose="request-information-card">
<!-- Header row of the card: Avatar, Provider Details & Status Badge -->
<div class="flex items-start justify-between gap-3">
<!-- Avatar and Provider info -->
<div class="flex items-start space-x-3">
<!-- Provider Avatar Placeholder Icon -->
<div class="w-12 h-12 rounded-full bg-slate-100 border border-slate-200 flex items-center justify-center text-slate-700 flex-shrink-0">
<svg class="w-8 h-8" fill="currentColor" viewbox="0 0 24 24">
<path clip-rule="evenodd" d="M18.685 19.097A9.723 9.723 0 0021.75 12c0-5.385-4.365-9.75-9.75-9.75S2.25 6.615 2.25 12a9.723 9.723 0 003.065 7.097A9.716 9.716 0 0012 21.75a9.716 9.716 0 006.685-2.653zm-12.54-1.285A7.486 7.486 0 0112 15a7.486 7.486 0 015.855 2.812A8.224 8.224 0 0112 20.25a8.224 8.224 0 01-5.855-2.438zM15.75 9a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0z" fill-rule="evenodd"></path>
</svg>
</div>
<!-- Provider Text Info -->
<div class="pt-0.5">
<div class="flex items-center space-x-1.5">
<h2 class="font-bold text-[#00112B] text-base leading-tight">Joaquin Pedernera</h2>
<!-- Verified Badge -->
<svg class="w-4 h-4 text-brand-primary" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" fill-rule="evenodd"></path>
</svg>
</div>
<!-- Address with Map Pin and Edit Pencil -->
<div class="flex items-center text-xs text-slate-600 mt-1.5 space-x-1">
<span>La rioja 555</span>
<!-- Pin icon -->
<svg class="w-3.5 h-3.5 text-brand-primary inline" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<!-- Edit address icon -->
<button class="p-0.5 text-slate-400 hover:text-brand-primary transition-colors inline-flex" title="Modificar dirección">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
</div>
</div>
<!-- Pending Status Badge ('En espera') -->
<span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-100 text-amber-800 border border-amber-200/80 shadow-sm flex-shrink-0 animate-pulse">
<span class="w-1.5 h-1.5 bg-amber-500 rounded-full mr-1.5"></span>
            En espera
          </span>
</div>
<!-- Section Divider -->
<hr class="border-[#E2E2E3]"/>
<!-- Schedules and details section -->
<div class="space-y-3">
<!-- Section title with edit button -->
<div class="flex items-center justify-between">
<div class="flex items-center space-x-2">
<h3 class="text-sm font-bold text-[#00112B]">Horarios y disponibilidad</h3>
<button class="text-slate-400 hover:text-brand-primary transition-colors" title="Modificar horarios">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
</div>
<span class="text-[11px] text-brand-primary font-medium cursor-pointer">Cambiar</span>
</div>
<!-- Schedule slots list / representation lines -->
<div class="space-y-2 bg-[#F4F5F7] p-3 rounded-xl border border-gray-200/60">
<div class="flex items-center justify-between text-xs py-1 border-b border-gray-200">
<span class="font-medium text-slate-700">Lunes a Miércoles:</span>
<span class="text-slate-900 font-semibold">16:00 a 19:00 hs</span>
</div>
<div class="flex items-center justify-between text-xs py-1 border-b border-gray-200">
<span class="font-medium text-slate-700">Viernes:</span>
<span class="text-slate-900 font-semibold">Turno Mañana (09:00 - 12:00)</span>
</div>
<div class="pt-1">
<p class="text-[11px] text-slate-500 italic">
                * Nota del cliente: Revisión de pérdida de agua en cañería de bacha de cocina.
              </p>
</div>
</div>
</div>
</section>
<!-- END: RequestDetailCard -->
<!-- BEGIN: ActionButtonsGroup -->
<!-- Interactive bottom actions matching wireframe layout -->
<section class="mt-auto space-y-3 pt-4 pb-safe" data-purpose="card-action-buttons">
<!-- Guardar Cambios (Save Changes) Button -->
<button class="w-full py-3.5 px-4 bg-white hover:bg-slate-50 text-[#00112B] font-semibold text-sm rounded-full border border-gray-300 shadow-sm active:scale-[0.98] transition-all flex items-center justify-center space-x-2" type="button">
<svg class="w-4 h-4 text-brand-primary" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>Guardar cambios</span>
</button>
<!-- Cancelar Pedido (Cancel Request) Button -->
<button class="w-full py-3.5 px-4 bg-white/70 hover:bg-red-50 text-red-600 font-semibold text-sm rounded-full border border-red-200 active:scale-[0.98] transition-all flex items-center justify-center space-x-2" type="button">
<svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span>Cancelar pedido</span>
</button>
</section>
<!-- END: ActionButtonsGroup -->
</main>
<!-- END: MainContentArea -->
<!-- BEGIN: iOSHomeIndicator -->
<div aria-hidden="true" class="w-full flex justify-center pb-2 pointer-events-none">
<div class="w-32 h-1 bg-slate-300 rounded-full"></div>
</div>
<!-- END: iOSHomeIndicator -->
</div>
<!-- END: MobileContainer -->
</body></html>
