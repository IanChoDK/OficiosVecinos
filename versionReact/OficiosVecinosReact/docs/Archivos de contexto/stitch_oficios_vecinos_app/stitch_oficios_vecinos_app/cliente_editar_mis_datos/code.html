<!DOCTYPE html>

<html class="h-full bg-slate-100" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Editar Perfil - Oficios Vecinos</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN with Forms & Container Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#1764AE',
              dark: '#00112B',
              surface: '#F4F3F4',
              accent: '#0d47a1',
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<!-- Custom Styles: iOS Viewport and Custom Scroll -->
<style data-purpose="custom-styling">
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input {
      user-select: text;
    }
    .safe-area-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .safe-area-bottom {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
  </style>
</head>
<body class="h-full font-sans antialiased text-slate-800 flex justify-center bg-slate-200 sm:py-6">
<!-- BEGIN: MobileContainer -->
<!-- Mobile frame simulation constrained to iPhone dimensions -->
<main class="w-full max-w-[420px] bg-slate-100 min-h-screen sm:min-h-[844px] sm:max-h-[920px] sm:rounded-[40px] shadow-2xl overflow-y-auto flex flex-col relative border border-slate-200/80">
<!-- BEGIN: TopBar -->
<!-- Top Bar with Brand, Search, Messages and User Avatar -->
<header class="bg-white px-4 pt-3 pb-3 border-b border-slate-200/70 sticky top-0 z-30 shadow-xs safe-area-top" data-purpose="main-header">
<div class="flex items-center justify-between gap-3">
<!-- Brand Name -->
<a aria-label="Inicio" class="font-extrabold text-sm sm:text-base leading-tight tracking-tight text-brand-dark flex flex-col shrink-0" href="#">
<span>Oficios</span>
<span class="text-brand-blue -mt-1">Vecinos</span>
</a>
<!-- Mini Search Bar -->
<div class="relative flex-1 max-w-[170px]" data-purpose="search-bar">
<input class="w-full bg-slate-100 text-xs text-slate-800 placeholder-slate-400 pl-3 pr-7 py-1.5 rounded-full border-none focus:ring-2 focus:ring-brand-blue/30 focus:bg-white transition-all shadow-inner" placeholder="Buscar" type="text"/>
<div class="absolute inset-y-0 right-0 flex items-center pr-2.5 pointer-events-none text-slate-400">
<svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M21 21l-4.35-4.35M17 11a6 6 0 11-12 0 6 6 0 0112 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
</div>
<!-- Right Action Icons (Chat & Mini Avatar) -->
<div class="flex items-center space-x-2 shrink-0">
<!-- Chat Button -->
<button aria-label="Mensajes" class="relative p-1.5 text-slate-700 hover:text-brand-blue rounded-full hover:bg-slate-100 transition-colors" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
<span class="absolute top-1 right-1 w-2 h-2 bg-emerald-500 rounded-full ring-2 ring-white"></span>
</button>
<!-- Current User Avatar Profile Icon -->
<div class="w-8 h-8 rounded-full bg-brand-dark flex items-center justify-center text-white ring-2 ring-slate-100 cursor-pointer overflow-hidden shadow-xs">
<span class="text-xs font-bold tracking-tight">R</span>
</div>
</div>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: NavigationSubHeader -->
<!-- Back Button Bar -->
<nav aria-label="Navegación de retorno" class="px-4 py-2.5 flex items-center">
<button aria-label="Volver a perfil" class="inline-flex items-center text-slate-600 hover:text-brand-dark font-medium text-sm group transition-colors" onclick="window.history.back()" type="button">
<span class="w-8 h-8 rounded-full bg-white shadow-xs border border-slate-200/80 flex items-center justify-center mr-2 group-hover:bg-slate-50 transition-colors">
<svg class="h-4 w-4 text-slate-700 group-hover:-translate-x-0.5 transition-transform" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</span>
<span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Volver al Perfil</span>
</button>
</nav>
<!-- END: NavigationSubHeader -->
<!-- BEGIN: FormCardContainer -->
<!-- Main content card representing the wireframe form panel -->
<div class="flex-1 px-4 pb-6 flex flex-col justify-start">
<section class="bg-[#F4F3F4] rounded-[28px] p-6 shadow-xs border border-slate-200/60 flex flex-col items-center flex-1 justify-between min-h-[580px]" data-purpose="edit-profile-card">
<!-- Top Content: Avatar & Inputs -->
<div class="w-full flex flex-col items-center">
<!-- Avatar Uploader Section with Camera Button -->
<div class="relative mt-2 mb-6 group cursor-pointer" data-purpose="avatar-uploader">
<!-- Large circular placeholder / profile image -->
<div class="w-28 h-28 sm:w-32 sm:h-32 rounded-full bg-[#00112B] flex items-center justify-center shadow-lg ring-4 ring-white relative overflow-hidden transition-transform active:scale-95">
<svg class="h-12 w-12 text-slate-100/90 group-hover:scale-110 transition-transform" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
<path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8"></path>
</svg>
</div>
<!-- Floating Badge for Camera Action -->
<button aria-label="Cambiar foto de perfil" class="absolute bottom-0 right-1 bg-brand-blue hover:bg-brand-accent text-white p-2.5 rounded-full shadow-md border-2 border-white transition-all transform hover:scale-105 active:scale-95" title="Cambiar foto de perfil" type="button">
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
<!-- Profile Form Fields -->
<form class="w-full space-y-4 max-w-xs" data-purpose="client-data-fields" id="edit-profile-form" onsubmit="event.preventDefault();">
<!-- Field: Nombre -->
<div class="flex flex-col text-left">
<label class="text-xs font-bold text-slate-700 mb-1 ml-2 tracking-wide" for="input-nombre">
                Nombre:
              </label>
<div class="relative">
<input class="w-full bg-white text-sm text-slate-900 font-medium px-4 py-2.5 rounded-full border border-slate-200 shadow-xs focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-brand-blue transition-all" id="input-nombre" name="nombre" placeholder="Roberto (Editar nombre)" required="" type="text" value="Roberto"/>
</div>
</div>
<!-- Field: Mail -->
<div class="flex flex-col text-left">
<label class="text-xs font-bold text-slate-700 mb-1 ml-2 tracking-wide" for="input-mail">
                Mail:
              </label>
<div class="relative">
<input class="w-full bg-white text-sm text-slate-900 font-medium px-4 py-2.5 rounded-full border border-slate-200 shadow-xs focus:outline-none focus:ring-2 focus:ring-brand-blue focus:border-brand-blue transition-all" id="input-mail" name="mail" placeholder="Roberto@email.com" required="" type="email" value="Roberto@email.com"/>
</div>
</div>
<!-- Context Hint / Help Text -->
<p class="text-[11px] text-slate-400 text-center px-4 pt-1">
              Los cambios se actualizarán de forma inmediata en tus solicitudes y contratos vigentes.
            </p>
</form>
</div>
<!-- Bottom Action: Guardar cambios Button -->
<div class="w-full max-w-xs pt-8 pb-2" data-purpose="form-actions">
<button class="w-full bg-[#00112B] hover:bg-slate-900 active:bg-brand-blue text-white font-semibold text-sm py-3.5 px-6 rounded-full shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center space-x-2 tracking-wide cursor-pointer focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-dark" form="edit-profile-form" type="submit">
<span>Guardar cambios</span>
<svg class="h-4 w-4" fill="none" stroke="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
</section>
</div>
<!-- END: FormCardContainer -->
<!-- BEGIN: FeedbackToast -->
<!-- Toast notification indicating state update preview -->
<div class="hidden absolute bottom-6 inset-x-6 bg-slate-900/95 text-white text-xs py-3 px-4 rounded-2xl shadow-xl flex items-center justify-between z-50 backdrop-blur-sm animate-fade-in" id="toast-success" role="status">
<div class="flex items-center space-x-2">
<span class="w-2 h-2 rounded-full bg-emerald-400"></span>
<span class="font-medium">¡Cambios guardados con éxito!</span>
</div>
<button class="text-slate-400 hover:text-white" onclick="document.getElementById('toast-success').classList.add('hidden')" type="button">✕</button>
</div>
<!-- END: FeedbackToast -->
</main>
<!-- END: MobileContainer -->
<!-- BEGIN: InteractiveScripts -->
<script data-purpose="form-interactions">
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('edit-profile-form');
      const toast = document.getElementById('toast-success');

      if (form && toast) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          // Show simulated success toast
          toast.classList.remove('hidden');
          setTimeout(() => {
            toast.classList.add('hidden');
          }, 3500);
        });
      }
    });
  </script>
<!-- END: InteractiveScripts -->
</body></html>
