<!DOCTYPE html>

<html class="h-full bg-slate-100" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Iniciar Sesión - Oficios Vecinos</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              navy: '#00112B',
              primary: '#1764AE',
              primaryHover: '#114f8b',
              gray: '#E2E2E3',
              light: '#F8F9FA'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"Segoe UI"', 'Roboto', 'Helvetica', 'Arial', 'sans-serif'],
          },
          boxShadow: {
            'ios': '0 2px 10px rgba(0, 17, 43, 0.06)',
            'ios-elevated': '0 12px 30px -4px rgba(23, 100, 174, 0.22)',
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Mobile Form Factor & Polishing -->
<style data-purpose="mobile-layout">
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input {
      user-select: text;
    }
    .safe-area-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .safe-area-bottom {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
  </style>
</head>
<body class="h-full flex flex-col justify-between text-brand-navy antialiased font-sans">
<!-- BEGIN: MainContainer -->
<div class="w-full max-w-md mx-auto min-h-screen bg-white flex flex-col shadow-2xl relative overflow-x-hidden" data-purpose="mobile-viewport">
<!-- BEGIN: TopBarAndHeader -->
<header class="w-full bg-white border-b border-brand-gray/60 sticky top-0 z-30" data-purpose="app-header">
<!-- iOS Status Bar Spacer -->
<div class="h-6 w-full bg-white safe-area-top"></div>
<!-- Navigation & Action Bar -->
<div class="px-3.5 py-2.5 flex items-center justify-between gap-2">
<!-- Brand Title & Back Button -->
<div class="flex items-center gap-1.5 flex-shrink-0">
<button aria-label="Volver" class="p-1 -ml-1 text-brand-navy hover:text-brand-primary active:scale-95 transition-all" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M15.75 19.5L8.25 12l7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<a class="font-extrabold text-[15px] tracking-tight text-brand-navy leading-none select-none" href="#">
            Oficios<br/><span class="text-brand-primary font-bold">Vecinos</span>
</a>
</div>
<!-- Search Bar -->
<div class="flex-1 max-w-[170px] relative">
<div class="relative w-full">
<input class="w-full py-1.5 pl-3 pr-7 text-xs bg-slate-50 border border-brand-gray rounded-full text-brand-navy placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-brand-primary focus:border-brand-primary transition-all" placeholder="Buscar" type="search"/>
<span class="absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-gray-400">
<svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
</div>
</div>
<!-- Header Auth Action Button -->
<div class="flex-shrink-0">
<button class="bg-brand-navy text-white text-[11px] font-medium px-2.5 py-1.5 rounded-md hover:bg-slate-800 active:scale-95 transition shadow-sm">
            Iniciar sesion
          </button>
</div>
</div>
</header>
<!-- END: TopBarAndHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex flex-col px-5 pt-6 pb-6 justify-between" data-purpose="login-form-wrapper">
<!-- Form Container Card -->
<section class="w-full">
<!-- Visual Card Wrapper as seen in the wireframe design -->
<div class="bg-slate-50/80 border border-brand-gray/80 rounded-2xl p-6 sm:p-7 shadow-ios transition-all">
<!-- Card Title -->
<h1 class="text-2xl font-bold text-center text-brand-navy mb-7 tracking-tight" data-purpose="screen-title">
            Iniciar sesion
          </h1>
<!-- Login Form -->
<form class="space-y-5" data-purpose="auth-form" onsubmit="event.preventDefault();">
<!-- Field 1: Usuario -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-brand-navy/70 tracking-wide uppercase px-0.5" for="username">
                Usuario
              </label>
<div class="relative flex items-center">
<!-- User Icon -->
<div class="absolute left-3.5 pointer-events-none text-brand-navy/60">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Input Element -->
<input class="w-full pl-11 pr-4 py-3 bg-white border border-brand-gray rounded-xl text-sm text-brand-navy font-normal placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-primary/20 focus:border-brand-primary transition shadow-inner" id="username" name="username" placeholder="Tu nombre de usuario o mail" required="" type="text"/>
</div>
</div>
<!-- Field 2: Contrasena -->
<div class="space-y-1.5">
<label class="block text-xs font-semibold text-brand-navy/70 tracking-wide uppercase px-0.5" for="password">
                Contrasena
              </label>
<div class="relative flex items-center">
<!-- Key Icon -->
<div class="absolute left-3.5 pointer-events-none text-brand-navy/60">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M15.75 5.25a3 3 0 0 1 3 3m3 0a6 6 0 0 1-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1 1 21.75 8.25Z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Input Element -->
<input class="w-full pl-11 pr-4 py-3 bg-white border border-brand-gray rounded-xl text-sm text-brand-navy font-normal placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-brand-primary/20 focus:border-brand-primary transition shadow-inner tracking-widest" id="password" name="password" placeholder="••••••••••••" required="" type="password"/>
</div>
</div>
</form>
</div>
</section>
<!-- Bottom Interactive Actions & Links -->
<section class="w-full pt-6 flex flex-col items-center gap-4 safe-area-bottom" data-purpose="actions-footer">
<!-- Main Primary Button -->
<button class="w-full py-3.5 px-4 bg-brand-primary hover:bg-brand-primaryHover text-white font-semibold text-base rounded-xl shadow-ios-elevated active:scale-[0.98] transition-all duration-200 text-center flex items-center justify-center gap-2" type="button">
<span>Continuar</span>
<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Secondary Link: Registration -->
<p class="text-xs text-brand-navy/80 text-center font-normal">
          No tienes cuenta? 
          <a class="font-bold text-brand-primary hover:underline ml-0.5" href="#">Registrate</a>
</p>
<!-- Horizontal Divider with Centered Dot -->
<div aria-hidden="true" class="w-4/5 flex items-center justify-center my-1 relative">
<div class="h-[1px] w-full bg-brand-gray"></div>
<div class="w-2.5 h-2.5 rounded-full bg-white border-2 border-brand-primary absolute"></div>
</div>
<!-- Forgot Password Link -->
<a class="text-xs font-semibold text-brand-navy/85 hover:text-brand-primary transition-colors py-1" href="#">
          Olvide mi contrasena
        </a>
</section>
</main>
<!-- END: MainContent -->
<!-- iOS Home Indicator -->
<div aria-hidden="true" class="h-1.5 w-32 bg-gray-300 rounded-full mx-auto mb-2 opacity-80"></div>
</div>
<!-- END: MainContainer -->
</body></html>
