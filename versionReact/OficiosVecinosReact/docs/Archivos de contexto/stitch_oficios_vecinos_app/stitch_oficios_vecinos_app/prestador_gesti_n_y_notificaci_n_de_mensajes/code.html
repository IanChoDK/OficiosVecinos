<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Oficios Vecinos - Gestión de Prestador</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Font: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- BEGIN: Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              primary: '#1764AE',
              primaryDark: '#124E89',
              dark: '#00112B',
              bgLight: '#F4F3F4',
              surface: '#FFFFFF',
              borderLight: '#E2E2E3',
              actionGray: '#6C727A',
              actionGrayDark: '#555C64',
              pillGray: '#D9DCDF'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 4px 20px -2px rgba(0, 17, 43, 0.06)',
            'btn': '0 3px 10px rgba(23, 100, 174, 0.15)',
          }
        }
      }
    }
  </script>
<!-- END: Tailwind Configuration -->
<!-- BEGIN: Custom Styles -->
<style data-purpose="custom-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #E9ECEF;
    }
    
    /* Smooth iOS touch interactions */
    .touch-btn {
      transition: transform 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .touch-btn:active {
      transform: scale(0.97);
    }
  </style>
<!-- END: Custom Styles -->
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4 text-brand-dark antialiased">
<!-- BEGIN: MobileDeviceFrame -->
<main class="w-full max-w-[414px] min-h-screen sm:min-h-[850px] sm:max-h-[896px] bg-white sm:rounded-[44px] shadow-2xl flex flex-col overflow-hidden relative border border-brand-borderLight" data-purpose="mobile-viewport">
<!-- BEGIN: iOSStatusBar -->
<section class="w-full pt-3 px-7 pb-2 flex justify-between items-center bg-brand-surface z-20 shrink-0 select-none" data-purpose="ios-status-bar">
<span class="text-xs font-bold tracking-tight text-brand-dark">9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular Signal -->
<svg class="w-3.5 h-3.5 fill-current text-brand-dark" viewbox="0 0 16 16">
<path d="M1 11h2v3H1v-3zm4-3h2v6H5V8zm4-3h2v9H9V5zm4-3h2v12h-2V2z"></path>
</svg>
<!-- Wifi -->
<svg class="w-3.5 h-3.5 fill-current text-brand-dark" viewbox="0 0 16 16">
<path d="M8 12.5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm-4.9-2.9a7.02 7.02 0 0 1 9.8 0 .75.75 0 0 0 1.06-1.06 8.52 8.52 0 0 0-11.92 0 .75.75 0 0 0 1.06 1.06zm-2.12-2.12a10.02 10.02 0 0 1 14.04 0 .75.75 0 0 0 1.06-1.06 11.52 11.52 0 0 0-16.16 0 .75.75 0 1 0 1.06 1.06z"></path>
</svg>
<!-- Battery -->
<div class="w-5 h-2.5 border border-brand-dark rounded-sm p-0.5 flex items-center">
<div class="h-full w-3/4 bg-brand-dark rounded-2xs"></div>
</div>
</div>
</section>
<!-- END: iOSStatusBar -->
<!-- BEGIN: MainHeader -->
<header class="w-full bg-brand-surface px-4 py-3 flex items-center justify-between border-b border-brand-borderLight/80 z-10 shrink-0" data-purpose="main-header">
<!-- Logo Branding -->
<a aria-label="Oficios Vecinos Inicio" class="flex flex-col leading-tight select-none focus:outline-none" href="#">
<span class="text-sm font-extrabold text-brand-dark tracking-tight leading-none">Oficios</span>
<span class="text-xs font-bold text-brand-primary tracking-normal leading-none mt-0.5">Vecinos</span>
</a>
<!-- Right Controls: Search, Messages with Badge & Profile Avatar -->
<div class="flex items-center space-x-2.5">
<!-- Compact Search Pill Input -->
<form action="#" class="relative flex items-center" data-purpose="search-form" method="GET" onsubmit="event.preventDefault();">
<label class="sr-only" for="header-search">Buscar servicios o profesionales</label>
<input class="w-24 xs:w-28 pl-3 pr-7 py-1 text-xs bg-brand-bgLight text-brand-dark placeholder-gray-500 rounded-full border border-brand-borderLight focus:outline-none focus:ring-1 focus:ring-brand-primary focus:border-brand-primary focus:w-32 transition-all duration-200" id="header-search" placeholder="Buscar" type="search"/>
<button aria-label="Ejecutar búsqueda" class="absolute right-2 text-gray-500 hover:text-brand-dark" type="submit">
<svg class="w-3.5 h-3.5 stroke-current fill-none stroke-[2.2]" viewbox="0 0 24 24">
<circle cx="11" cy="11" r="7"></circle>
<line x1="21" x2="16.65" y1="21" y2="16.65"></line>
</svg>
</button>
</form>
<!-- Chat / Message Icon with Notification Badge (1 New Message) -->
<a aria-label="Mensajes nuevos: 1 pendiente" class="relative p-1.5 text-brand-dark hover:text-brand-primary rounded-full transition-colors" data-purpose="chat-button" href="#mensajes">
<!-- Chat Outline Icon matching wireframe -->
<svg class="w-6 h-6 stroke-current fill-none stroke-[2]" viewbox="0 0 24 24">
<path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<!-- Notification Pill/Badge: '1' as seen in bottom-left wireframe -->
<span aria-hidden="true" class="absolute -top-0.5 -right-0.5 min-w-[17px] h-[17px] px-1 bg-brand-primary text-white text-[10px] font-bold rounded-full flex items-center justify-center ring-2 ring-white animate-pulse">
            1
          </span>
</a>
<!-- Profile Avatar (Roberto) -->
<button aria-label="Ver perfil de Roberto" class="relative rounded-full focus:outline-none focus:ring-2 focus:ring-brand-primary focus:ring-offset-1" data-purpose="profile-avatar-button">
<div class="w-8 h-8 rounded-full bg-brand-dark flex items-center justify-center overflow-hidden border border-brand-borderLight">
<span class="text-xs font-semibold text-white tracking-wider">R</span>
</div>
<!-- Online status dot -->
<span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-emerald-500 rounded-full border-2 border-white"></span>
</button>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: MainContent -->
<div class="flex-1 px-5 py-4 overflow-y-auto flex flex-col justify-between" data-purpose="scrollable-content">
<!-- Upper Section: Gestion Central Card -->
<section aria-labelledby="gestion-title" class="w-full bg-brand-bgLight rounded-2xl p-5 border border-brand-borderLight shadow-card" data-purpose="management-card">
<!-- Section Title -->
<div class="text-center mb-6">
<h1 class="text-xl font-bold text-brand-dark tracking-tight" id="gestion-title">Gestión</h1>
<p class="text-xs text-brand-dark/60 mt-0.5 font-medium">Panel de control de prestador</p>
</div>
<!-- Action Buttons Container -->
<div class="space-y-4">
<!-- Primary Action 1: Ofrecer un nuevo servicio -->
<button class="touch-btn w-full h-24 bg-brand-actionGray hover:bg-brand-actionGrayDark text-white font-semibold text-base sm:text-lg rounded-2xl flex items-center justify-center text-center px-4 shadow-sm border border-black/5 focus:outline-none focus:ring-4 focus:ring-brand-actionGray/20 group" data-purpose="offer-service-btn" type="button">
<div class="flex flex-col items-center">
<span class="leading-snug">Ofrecer un nuevo servicio</span>
<span class="text-[11px] text-white/80 font-normal mt-0.5 group-hover:text-white transition-colors">+ Publicar publicación</span>
</div>
</button>
<!-- Primary Action 2: Mis servicios -->
<button class="touch-btn w-full h-24 bg-brand-actionGray hover:bg-brand-actionGrayDark text-white font-semibold text-base sm:text-lg rounded-2xl flex items-center justify-center text-center px-4 shadow-sm border border-black/5 focus:outline-none focus:ring-4 focus:ring-brand-actionGray/20 group" data-purpose="my-services-btn" type="button">
<div class="flex flex-col items-center">
<span class="leading-snug">Mis servicios</span>
<span class="text-[11px] text-white/80 font-normal mt-0.5 group-hover:text-white transition-colors">Activos, pausados y presupuestos</span>
</div>
</button>
</div>
</section>
<!-- Bottom Navigation Buttons (Non-fixed, inline page actions as per design wireframe) -->
<section aria-label="Navegación secundaria de usuario" class="w-full pt-5 pb-4 space-y-3 shrink-0" data-purpose="navigation-pills-section">
<!-- Button: Ir al Perfil -->
<a class="touch-btn w-full h-13 py-3.5 bg-brand-pillGray/90 hover:bg-brand-pillGray text-brand-dark font-semibold text-base rounded-full flex items-center justify-center border border-brand-borderLight text-center shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-primary" data-purpose="go-profile-btn" href="#perfil">
          Ir al Perfil
        </a>
<!-- Button: Mensajes (with unread counter pill indicator) -->
<a class="touch-btn w-full h-13 py-3.5 bg-brand-pillGray/90 hover:bg-brand-pillGray text-brand-dark font-semibold text-base rounded-full flex items-center justify-center relative border border-brand-borderLight shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-primary" data-purpose="go-messages-btn" href="#mensajes">
<span>Mensajes</span>
<!-- Active Notification Pill -->
<span aria-label="1 mensaje no leído" class="ml-2 inline-flex items-center justify-center px-2 py-0.5 text-xs font-bold leading-none text-white bg-brand-primary rounded-full shadow-sm">
            1 nuevo
          </span>
</a>
</section>
</div>
<!-- END: MainContent -->
<!-- BEGIN: iOSHomeIndicator -->
<div aria-hidden="true" class="w-full pb-2 pt-1 flex justify-center bg-brand-surface shrink-0" data-purpose="ios-home-indicator">
<div class="w-32 h-1 bg-brand-dark/25 rounded-full"></div>
</div>
<!-- END: iOSHomeIndicator -->
</main>
<!-- END: MobileDeviceFrame -->
</body></html>
