<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Oficios Vecinos - Cambios Guardados con Éxito</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#1764AE',
              dark: '#00112B',
              success: '#10B981',
              lightGray: '#F3F4F6',
              cardBg: '#52525B',
              cardDark: '#3F3F46'
            }
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
<!-- Custom Styles for iOS Look and Layout -->
<style data-purpose="custom-layout">
    body {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .safe-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-900 flex justify-center min-h-screen antialiased">
<!-- Mobile iOS Screen Container -->
<div class="w-full max-w-md bg-white min-h-screen flex flex-col shadow-2xl relative overflow-hidden">
<!-- BEGIN: TopBarAndHeader -->
<header class="bg-[#D9D9D9] border-b border-gray-300 safe-top flex-shrink-0">
<!-- Top Navigation Row (Logo, Search, Chat, Profile) -->
<div class="px-4 py-2.5 flex items-center justify-between gap-2">
<!-- Logo Text -->
<div class="flex flex-col leading-tight select-none">
<span class="text-xs font-bold tracking-tight text-gray-900">Oficios</span>
<span class="text-xs font-semibold tracking-tight text-gray-800 -mt-0.5">Vecinos</span>
</div>
<!-- Search Bar with Pill Style -->
<div class="flex-1 max-w-[170px] relative">
<div class="w-full bg-white rounded-full h-7 pl-3 pr-7 flex items-center text-xs text-gray-400 shadow-inner">
<span class="text-[11px] truncate">Buscar</span>
</div>
<svg class="w-3.5 h-3.5 text-gray-500 absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M21 21l-4.35-4.35M16.65 11a5.65 5.65 0 11-11.3 0 5.65 5.65 0 0111.3 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</div>
<!-- Header Actions: Chat and Profile -->
<div class="flex items-center space-x-2">
<!-- Chat Icon Button -->
<button aria-label="Mensajes" class="p-1 text-gray-800 hover:text-brand-blue transition-colors" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
</svg>
</button>
<!-- User Avatar Circle -->
<div class="w-7 h-7 rounded-full bg-[#1e2329] border border-gray-400 flex items-center justify-center text-white text-[11px] font-medium shadow-sm">
<span>R</span>
</div>
</div>
</div>
<!-- Secondary Navigation Bar with Back Button -->
<div class="bg-[#BFC2C7] px-3 py-1.5 flex items-center border-t border-gray-300">
<button aria-label="Volver atrás" class="flex items-center text-gray-800 hover:text-black transition-transform active:scale-95" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
</button>
</div>
</header>
<!-- END: TopBarAndHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 flex flex-col items-center justify-center px-5 py-6 bg-gray-50">
<!-- Confirmation Success Card -->
<div class="w-full max-w-sm bg-[#545558] text-white rounded-3xl p-8 flex flex-col items-center justify-between shadow-xl min-h-[460px] border border-gray-600/40" data-purpose="success-card">
<!-- Top Status Indicator & Decorative Icon -->
<div class="w-full flex flex-col items-center pt-2">
<!-- Animated / High-Contrast Success Badge -->
<div class="w-20 h-20 rounded-full bg-emerald-500/20 border-2 border-emerald-400 flex items-center justify-center mb-6 shadow-inner">
<svg class="w-10 h-10 text-emerald-400" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path>
</svg>
</div>
<!-- Main Success Heading (Faithful to wireframe uppercase style) -->
<h1 class="text-2xl sm:text-[26px] font-extrabold tracking-wide text-center leading-snug uppercase px-2 text-white">
            CAMBIOS GUARDADOS CON ÉXITO!
          </h1>
<!-- Confirmation Subtitle -->
<p class="mt-4 text-xs sm:text-sm text-gray-200 text-center leading-relaxed font-normal px-2">
            Tus datos personales y de perfil profesional se actualizaron correctamente para tus vecinos clientes.
          </p>
</div>
<!-- Action Section with 'Volver' Button -->
<div class="w-full mt-8 flex flex-col items-center">
<a class="w-full max-w-[210px] bg-[#B0B3BA] hover:bg-[#C2C5CD] active:bg-[#9EA1A8] text-gray-900 font-semibold text-sm py-2.5 px-6 rounded-xl transition duration-150 text-center shadow" href="#">
            Volver
          </a>
</div>
</div>
</main>
<!-- END: MainContent -->
<!-- Safe area spacing footer (no menu bar) -->
<div class="safe-bottom bg-gray-50 flex-shrink-0"></div>
</div>
</body></html>
