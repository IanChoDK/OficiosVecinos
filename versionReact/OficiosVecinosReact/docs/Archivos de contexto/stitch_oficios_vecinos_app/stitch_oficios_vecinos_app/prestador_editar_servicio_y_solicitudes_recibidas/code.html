<!DOCTYPE html>

<html class="h-full bg-slate-100" lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Prestador - Editar Servicio y Solicitudes Recibidas</title>
<!-- Tailwind CSS v3 with forms & container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Phosphor Icons for crisp mobile UI glyphs -->
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style data-purpose="custom-styling">
    /* iOS friendly scrolling and smooth transitions */
    body {
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="h-full flex justify-center items-start sm:py-6 bg-slate-200">
<!-- BEGIN: MobileContainer -->
<!-- Constrained mobile iOS container mimicking screen 3 of the wireframe -->
<div class="w-full max-w-[414px] bg-[#a8abb0] min-h-screen sm:min-h-[896px] sm:max-h-[920px] sm:rounded-[40px] shadow-2xl flex flex-col overflow-hidden relative border border-slate-300">
<!-- BEGIN: TopBar -->
<!-- Status header & brand navigation matching Oficios Vecinos design -->
<header class="bg-[#dcdde0] px-4 pt-3 pb-3 flex items-center justify-between border-b border-gray-300 shrink-0">
<!-- Brand Logo / Title -->
<div class="leading-tight select-none">
<span class="block text-[13px] font-extrabold tracking-tight text-gray-900 leading-none">Oficios</span>
<span class="block text-[13px] font-extrabold tracking-tight text-gray-900 leading-none">Vecinos</span>
</div>
<!-- Compact Search Bar -->
<div class="flex-1 max-w-[155px] mx-2">
<div class="relative flex items-center">
<input aria-label="Buscar en Oficios Vecinos" class="w-full bg-white text-gray-800 text-xs rounded-full pl-3 pr-7 py-1 border border-gray-300 focus:outline-none focus:ring-1 focus:ring-gray-400 placeholder-gray-400 shadow-inner" placeholder="Buscar" type="text"/>
<i class="ph ph-magnifying-glass absolute right-2.5 text-xs text-gray-600 pointer-events-none"></i>
</div>
</div>
<!-- Chat icon & Avatar profile -->
<div class="flex items-center gap-2.5">
<button aria-label="Mensajes y chat" class="text-gray-900 hover:text-black transition" type="button">
<i class="ph ph-chat-teardrop-text text-2xl"></i>
</button>
<button aria-label="Perfil de usuario" class="w-8 h-8 rounded-full bg-[#1e2329] border border-gray-400 flex items-center justify-center text-white text-xs font-semibold overflow-hidden" type="button">
<i class="ph ph-user text-base"></i>
</button>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: ActionHeader -->
<!-- Navigation action strip: Back button & Delete button -->
<nav aria-label="Acciones de servicio" class="bg-[#a8abb0] px-4 py-2.5 flex items-center justify-between shrink-0">
<button aria-label="Volver a Mis Servicios" class="w-8 h-8 rounded-full bg-[#d0d3d8] flex items-center justify-center text-gray-800 hover:bg-gray-200 active:scale-95 transition shadow-sm" title="Volver" type="button">
<i class="ph ph-arrow-left text-lg font-bold"></i>
</button>
<button aria-label="Eliminar servicio" class="w-8 h-8 rounded-full bg-[#d0d3d8] flex items-center justify-center text-gray-800 hover:text-red-700 hover:bg-gray-200 active:scale-95 transition shadow-sm" title="Eliminar este servicio" type="button">
<i class="ph ph-trash text-lg font-bold"></i>
</button>
</nav>
<!-- END: ActionHeader -->
<!-- BEGIN: MainContent -->
<!-- Scrollable central workflow view -->
<main class="flex-1 overflow-y-auto hide-scrollbar px-4 pb-6 flex flex-col gap-4">
<!-- BEGIN: ServiceMediaHero -->
<!-- Visual container for service main picture or upload prompt -->
<section class="w-full bg-white rounded-2xl border-2 border-dashed border-gray-300 p-6 flex flex-col items-center justify-center min-h-[220px] shadow-sm relative group cursor-pointer hover:border-gray-500 transition">
<input accept="image/*" aria-label="Subir foto del servicio" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" type="file"/>
<!-- Large Camera Icon matching Wireframe -->
<div class="flex flex-col items-center text-gray-800 select-none">
<i class="ph ph-camera text-7xl stroke-[1.2] mb-1"></i>
<span class="text-xs font-semibold text-gray-700 mt-1 bg-gray-100 px-3 py-1 rounded-full border border-gray-200">
            Cambiar o añadir foto del trabajo
          </span>
<span class="text-[10px] text-gray-400 mt-1">Formatos sugeridos: JPG, PNG (máx. 5MB)</span>
</div>
</section>
<!-- END: ServiceMediaHero -->
<!-- BEGIN: ServiceEditableDetails -->
<!-- Form to edit the title, description and save adjustments -->
<section class="flex flex-col gap-3">
<!-- Title Field with Inline Edit Pencil -->
<div class="bg-transparent">
<div class="flex items-center justify-between gap-2 mb-1">
<label class="text-xs font-semibold uppercase tracking-wider text-gray-800" for="service-title">
              Título del Servicio
            </label>
<i class="ph ph-pencil-simple text-sm text-gray-800"></i>
</div>
<div class="relative">
<input class="w-full bg-white/80 font-bold text-gray-900 text-base rounded-xl px-3.5 py-2.5 border border-gray-300 focus:bg-white focus:ring-2 focus:ring-gray-700 focus:border-transparent transition shadow-sm" id="service-title" placeholder="Ej. Proveedor - Servicio" type="text" value="Carpintería y Muebles a Medida"/>
</div>
</div>
<!-- Description Field with Inline Edit Pencil -->
<div class="bg-transparent">
<div class="flex items-center justify-between gap-2 mb-1">
<label class="text-xs font-semibold uppercase tracking-wider text-gray-800" for="service-desc">
              Descripción y Condiciones
            </label>
<i class="ph ph-pencil-simple text-sm text-gray-800"></i>
</div>
<div class="relative">
<textarea class="w-full bg-white/80 text-gray-800 text-xs leading-relaxed rounded-xl p-3 border border-gray-300 focus:bg-white focus:ring-2 focus:ring-gray-700 focus:border-transparent transition shadow-sm resize-none" id="service-desc" placeholder="Información, ejemplo de información, el servicio es tal..." rows="3">Reparación y fabricación de bajo mesadas, alacenas y placares a medida. Presupuesto sin cargo en zona norte. Trabajos garantizados y colocación incluida.</textarea>
</div>
</div>
<!-- Save Changes Button -->
<div class="flex justify-center mt-1">
<button class="bg-[#e4e5e8] hover:bg-white active:bg-gray-300 text-gray-900 font-medium text-sm px-8 py-2 rounded-full border border-gray-400 shadow-sm transition active:scale-95" type="button">
            Guardar cambios
          </button>
</div>
</section>
<!-- END: ServiceEditableDetails -->
<!-- BEGIN: ReceivedRequestsSection -->
<!-- Section displaying clients who requested this service -->
<section class="bg-[#dcdde0] rounded-2xl p-3.5 shadow-sm border border-gray-300">
<h2 class="text-xs font-bold text-gray-800 uppercase tracking-wide mb-2.5">
          Solicitudes
        </h2>
<!-- Grid with client request cards -->
<div class="grid grid-cols-3 gap-2.5">
<!-- Request Card 1: Marta -->
<article class="bg-[#5f6368] rounded-xl p-2 flex flex-col justify-between items-center text-center shadow">
<div class="w-full py-1">
<span class="block text-white text-xs font-bold truncate">Marta</span>
<span class="block text-[10px] text-gray-200 truncate mt-0.5">Hace 2h</span>
</div>
<button class="w-full mt-2 bg-[#4b4e54] hover:bg-[#383a3e] active:scale-95 text-white text-[11px] font-medium py-1.5 px-1 rounded-lg transition border border-gray-500 shadow-inner" type="button">
              Ver detalles
            </button>
</article>
<!-- Request Card 2: Joaquin -->
<article class="bg-[#5f6368] rounded-xl p-2 flex flex-col justify-between items-center text-center shadow">
<div class="w-full py-1">
<span class="block text-white text-xs font-bold truncate">Joaquin</span>
<span class="block text-[10px] text-gray-200 truncate mt-0.5">Ayer</span>
</div>
<button class="w-full mt-2 bg-[#4b4e54] hover:bg-[#383a3e] active:scale-95 text-white text-[11px] font-medium py-1.5 px-1 rounded-lg transition border border-gray-500 shadow-inner" type="button">
              Ver detalles
            </button>
</article>
<!-- Request Card 3: Pipi -->
<article class="bg-[#5f6368] rounded-xl p-2 flex flex-col justify-between items-center text-center shadow">
<div class="w-full py-1">
<span class="block text-white text-xs font-bold truncate">Pipi</span>
<span class="block text-[10px] text-gray-200 truncate mt-0.5">14 Feb</span>
</div>
<button class="w-full mt-2 bg-[#4b4e54] hover:bg-[#383a3e] active:scale-95 text-white text-[11px] font-medium py-1.5 px-1 rounded-lg transition border border-gray-500 shadow-inner" type="button">
              Ver detalles
            </button>
</article>
</div>
</section>
<!-- END: ReceivedRequestsSection -->
</main>
<!-- END: MainContent -->
</div>
<!-- END: MobileContainer -->
</body></html>
