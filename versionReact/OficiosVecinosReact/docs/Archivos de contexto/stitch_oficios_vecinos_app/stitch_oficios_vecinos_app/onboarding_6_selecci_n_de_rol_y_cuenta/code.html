<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Oficios Vecinos - Selección de Rol</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#2563eb',
              600: '#1764ae',
              700: '#1d4ed8',
              800: '#1e40af',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    /* Estilos para el estado activo de los radio buttons */
    .role-card input[type="radio"]:checked + .card-content {
      border-color: #1764ae;
      background-color: #f8fafc;
      box-shadow: 0 4px 16px -2px rgba(23, 100, 174, 0.12), 0 2px 6px -1px rgba(23, 100, 174, 0.08);
    }
    .role-card input[type="radio"]:checked + .card-content .radio-circle {
      border-color: #1764ae;
      background-color: #1764ae;
    }
    .role-card input[type="radio"]:checked + .card-content .check-icon {
      opacity: 1;
      transform: scale(1);
    }
  </style>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen text-slate-800 antialiased p-0 sm:p-4">
<!-- BEGIN: MobileFrameContainer -->
<!-- Contenedor adaptado a dimensiones de pantalla estándar móvil iPhone/iOS -->
<div class="w-full max-w-[414px] min-h-screen sm:min-h-[844px] bg-white sm:rounded-[40px] shadow-2xl flex flex-col justify-between overflow-hidden relative border border-slate-100" data-purpose="mobile-viewport">
<!-- BEGIN: iOSStatusBar -->
<!-- Barra de estado simulada de iOS -->
<div class="w-full pt-3 px-7 flex justify-between items-center text-xs font-semibold text-slate-900 select-none" data-purpose="status-bar">
<span>9:41</span>
<div class="flex items-center space-x-2">
<!-- Señal Celular -->
<svg class="w-4 h-3 fill-current" viewbox="0 0 17 11">
<path d="M1 9.5h1.5a.5.5 0 00.5-.5V8a.5.5 0 00-.5-.5H1a.5.5 0 00-.5.5v1a.5.5 0 00.5.5zm4 0h1.5a.5.5 0 00.5-.5V6a.5.5 0 00-.5-.5H5a.5.5 0 00-.5.5v3a.5.5 0 00.5.5zm4 0h1.5a.5.5 0 00.5-.5V4a.5.5 0 00-.5-.5H9a.5.5 0 00-.5.5v5a.5.5 0 00.5.5zm4 0h1.5a.5.5 0 00.5-.5V1a.5.5 0 00-.5-.5h-1.5a.5.5 0 00-.5.5v8a.5.5 0 00.5.5z"></path>
</svg>
<!-- WiFi -->
<svg class="w-4 h-3 fill-current" viewbox="0 0 16 12">
<path d="M8 3.6c2.4 0 4.6.9 6.2 2.5l1.4-1.4C13.8 2.8 11 1.8 8 1.8 5 1.8 2.2 2.8.4 4.7l1.4 1.4C3.4 4.5 5.6 3.6 8 3.6zm0 3.7c1.5 0 2.8.6 3.8 1.6l1.4-1.4C11.9 6.2 10.1 5.4 8 5.4 5.9 5.4 4.1 6.2 2.8 7.5l1.4 1.4c1-1 2.3-1.6 3.8-1.6zm0 3.7a1.5 1.5 0 100-3 1.5 1.5 0 000 3z"></path>
</svg>
<!-- Batería -->
<div class="w-6 h-3 border border-slate-900 rounded-[3px] p-[1px] flex items-center">
<div class="h-full w-full bg-slate-900 rounded-[1px]"></div>
</div>
</div>
</div>
<!-- END: iOSStatusBar -->
<!-- BEGIN: TopHeader -->
<!-- Logotipo y nombre de aplicación de la esquina superior izquierda según wireframe -->
<header class="pt-5 px-6 pb-2" data-purpose="app-header">
<div class="flex items-center space-x-2">
<div class="w-8 h-8 rounded-full bg-blue-50 flex items-center justify-center text-[#1764ae]">
<svg class="w-4 h-4 stroke-current stroke-2 fill-none" viewbox="0 0 24 24">
<path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<div class="leading-none">
<span class="block text-[15px] font-bold tracking-tight text-slate-900">Oficios</span>
<span class="block text-[15px] font-bold tracking-tight text-[#1764ae]">Vecinos</span>
</div>
</div>
</header>
<!-- END: TopHeader -->
<!-- BEGIN: MainContent -->
<main class="flex-1 px-6 pt-6 pb-4 flex flex-col justify-start" data-purpose="role-selection-screen">
<!-- Título principal -->
<section class="mt-4 mb-8 text-center sm:text-left">
<h1 class="text-[26px] sm:text-[28px] font-extrabold text-slate-900 leading-snug tracking-tight">
          ¿Cómo querés usar<br/>
<span class="text-[#1764ae]">Oficios Vecinos</span>?
        </h1>
<p class="text-sm text-slate-500 mt-2 font-normal">
          Podrás alternar de modalidad cuando lo necesites.
        </p>
</section>
<!-- Selector de roles mediante tarjetas seleccionables -->
<form class="space-y-4" id="role-selection-form">
<!-- Tarjeta Rol: Cliente (Seleccionada por defecto) -->
<label class="role-card block relative cursor-pointer group">
<input checked="" class="sr-only" name="user_role" type="radio" value="cliente"/>
<div class="card-content flex items-center p-4 sm:p-5 rounded-2xl border-2 border-slate-200 transition-all duration-200 bg-white group-hover:border-slate-300">
<!-- Radio / Check Indicador -->
<div class="radio-circle w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center mr-4 transition-all duration-200 shrink-0">
<svg class="check-icon w-3.5 h-3.5 text-white opacity-0 transform scale-50 transition-all duration-150 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Información del Rol -->
<div class="flex-1">
<div class="flex items-center space-x-1.5">
<span class="text-lg font-bold text-slate-900 tracking-tight">Cliente</span>
</div>
<p class="text-[13px] text-slate-500 font-medium mt-0.5 leading-tight">
                Busco un servicio
              </p>
</div>
<!-- Ícono decorativo secundario -->
<div class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewbox="0 0 24 24">
<path d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</label>
<!-- Tarjeta Rol: Prestador -->
<label class="role-card block relative cursor-pointer group">
<input class="sr-only" name="user_role" type="radio" value="prestador"/>
<div class="card-content flex items-center p-4 sm:p-5 rounded-2xl border-2 border-slate-200 transition-all duration-200 bg-white group-hover:border-slate-300">
<!-- Radio / Check Indicador -->
<div class="radio-circle w-6 h-6 rounded-full border-2 border-slate-300 flex items-center justify-center mr-4 transition-all duration-200 shrink-0">
<svg class="check-icon w-3.5 h-3.5 text-white opacity-0 transform scale-50 transition-all duration-150 stroke-[3]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Información del Rol -->
<div class="flex-1">
<div class="flex items-center space-x-1.5">
<span class="text-lg font-bold text-slate-900 tracking-tight">Prestador</span>
</div>
<p class="text-[13px] text-slate-500 font-medium mt-0.5 leading-tight">
                Ofrezco un servicio y recibo pedidos
              </p>
</div>
<!-- Ícono decorativo secundario -->
<div class="w-10 h-10 rounded-xl bg-slate-50 flex items-center justify-center text-slate-400">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewbox="0 0 24 24">
<path d="M11.42 15.17L17.25 21A2.67 2.67 0 0021 17.25l-5.83-5.83M3 3l6.5 6.5M10.5 4.5l3 3M4.5 10.5l3 3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</label>
</form>
</main>
<!-- END: MainContent -->
<!-- BEGIN: FooterActions -->
<footer class="px-6 pb-6 pt-2 flex flex-col items-center" data-purpose="onboarding-controls">
<!-- Paginación de Dots (Último paso activo de 5 pasos) -->
<div aria-label="Progreso de onboarding" class="flex items-center justify-center space-x-1.5 mb-6" data-purpose="pagination-dots">
<span class="w-1.5 h-1.5 rounded-full bg-slate-300 transition-all"></span>
<span class="w-1.5 h-1.5 rounded-full bg-slate-300 transition-all"></span>
<span class="w-1.5 h-1.5 rounded-full bg-slate-300 transition-all"></span>
<span class="w-1.5 h-1.5 rounded-full bg-slate-300 transition-all"></span>
<!-- Dot activo con ancho expandido y color de acento -->
<span class="w-5 h-1.5 rounded-full bg-[#1764ae] transition-all"></span>
</div>
<!-- Botón Principal: Crear cuenta -->
<button class="w-full bg-[#1764ae] hover:bg-[#13528f] active:scale-[0.98] text-white font-bold py-4 px-6 rounded-2xl shadow-lg shadow-blue-900/20 text-base transition-all duration-150 flex items-center justify-center space-x-2 focus:outline-none focus:ring-4 focus:ring-blue-100" data-purpose="submit-button" type="button">
<span>Crear cuenta</span>
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Enlace Secundario: Modo Invitado -->
<a class="mt-4 text-[13px] font-semibold text-slate-500 hover:text-slate-800 underline decoration-slate-300 underline-offset-4 py-1 transition-colors" data-purpose="guest-link" href="#">
        Continuar a la app en modo invitado
      </a>
<!-- iOS Home Indicator bar -->
<div class="w-32 h-1 bg-slate-300 rounded-full mt-5 mx-auto"></div>
</footer>
<!-- END: FooterActions -->
</div>
<!-- END: MobileFrameContainer -->
</body></html>
